[package]
name = "code-rs"
version = "1.2.7"
description = "VS Code workbench running on Tauri 2 (Rust shell replacing Electron)"
authors = ["code-rs contributors"]
edition = "2021"
rust-version = "1.77"

# The library is what Tauri's mobile/desktop entrypoints link against.
[lib]
name = "code_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tiny_http = "0.12"
getrandom = "0.3"
dirs = "6"
sha2 = "0.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
ureq = "3"
# --- muse gadget service (services/muse.rs) ---
# Noise_XX_25519_AESGCM_SHA256 is hand-rolled on these RustCrypto primitives
# because the SDK uses a big-endian AEAD nonce, which `snow` is not wire-
# compatible with. x25519-dalek for the link DH, aes-gcm for both AEADs, hmac
# (+ the existing sha2) for HKDF. The BLE setup handshake (provision_v2) is
# P-256 ECDH, so `p256` is added for that curve; HKDF for the record keys uses
# the `hkdf` crate (RFC 5869, as the SDK's `cryptography.hazmat ... HKDF` does).
x25519-dalek = { version = "2", features = ["static_secrets"] }
p256 = { version = "0.13", features = ["ecdh"] }
aes-gcm = "0.10"
hmac = "0.12"
hkdf = "0.12"
# Live link session (services/muse/link/session.rs): a sync WebSocket client
# with rustls TLS (no OpenSSL). Only needed for muse_connect/muse_send, which
# run once the device is paired.
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"

zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# pty service (services/pty.rs): ConPTY on Windows, openpty/forkpty on unix.
portable-pty = "0.8"

# --- search service (ripgrep library crates) ---
ignore = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"

# --- fs/watcher service deps (fs.rs, watcher.rs) ---
base64 = "0.22"
notify = "6.1"
notify-debouncer-full = "0.3"
trash = "3"

# --- extension host bridge (services/extension_host.rs) ---
# Async runtime used by the relay; Tauri already pulls tokio in, we just need
# the process / io-util / sync / macros features for spawning node and piping.
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros"] }
# Cross-platform named pipe (Windows) / unix domain socket transport for the
# VSCODE_EXTHOST_IPC_HOOK connection.
interprocess = { version = "2", features = ["tokio"] }
# base64 (declared above) is also used for exthost://data framing.

# BLE GATT peripheral for Muse pairing (services/muse/ble.rs). Windows only:
# the WinRT GattServiceProvider + BluetoothLEAdvertisementPublisher APIs. Other
# OSes return a "not supported yet" error, so the crate is target-gated.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Bluetooth_Advertisement",
] }

[profile.release]
# Smaller, faster binary (the CLI uses the same settings).
lto = "thin"
strip = true

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
